name: Unit Test CI

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/unit-tests.yaml
      - '**.java'
      - '**.jte'
      - 'bitubi-inference-4j-server/src/main/resources/**'
      - '**/pom.xml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is ARM (arm64); macos-15-intel is x86_64. Confirm the labels in the GitHub documentation.
        os: [ ubuntu-latest, windows-latest, macos-latest, macos-15-intel ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          mvn-toolchain-vendor: Eclipse Adoptium
          cache: maven
      - name: Cache small models used by the tests
        uses: actions/cache@v4
        with:
          path: |
            bitubi-inference-4j-tests/models
            bitubi-inference-4j-net/models
          key: models-qwen2.5-0.5b-jq4-tinyllama-q4
      # TestSample downloads multi-GB models and is excluded from CI.
      - name: Compile, run tests, and package (JDK 25)
        id: build
        env:
          SMOKE_MODEL: "1"
          SMOKE_RELAXED: "1" # the reference text was recorded on other hardware: here it only requires non-empty text
        run: ./mvnw -B package '-Dtest=!TestSample' -Dsurefire.failIfNoSpecifiedTests=false
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-diagnostics-${{ matrix.os }}
          path: |
            hs_err_pid*.log
            **/target/surefire-reports/
      - name: Performance snapshot (informational)
        if: always()
        run: |
          docs/benchmarks/run-perf.sh "$JAVA_HOME" | tee perf.txt
          { echo '### Performance on ${{ matrix.os }}'; echo '```'; cat perf.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # The chat UI in a real browser (Playwright for Java, headless Chromium). Not part of the default build: -Pe2e.
  ui-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest, macos-15-intel ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          mvn-toolchain-vendor: Eclipse Adoptium
          cache: maven
      - name: Cache the browsers Playwright downloads
        uses: actions/cache@v4
        with:
          path: .playwright
          key: playwright-1.64.0-${{ runner.os }}-${{ runner.arch }}
      - name: Browser tests of the chat UI
        run: ./mvnw -B -pl bitubi-inference-4j-server -am package -Pe2e '-Dtest=*E2E' -Dsurefire.failIfNoSpecifiedTests=false
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-e2e-diagnostics-${{ matrix.os }}
          path: bitubi-inference-4j-server/target/surefire-reports/
