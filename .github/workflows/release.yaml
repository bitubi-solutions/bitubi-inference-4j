name: Release

# MANUAL release: only runs when someone triggers the workflow in the Actions tab and enters the version.
# Publishes to GitHub Packages (https://maven.pkg.github.com/bitubi-solutions/bitubi-inference-4j).
# Limitation: the job publishes the Linux classifier (linux-x86_64) of bitubi-inference-4j-native.
# The macOS and Windows classifiers are not published yet (not verified whether GitHub Packages
# accepts republishing the same POM and main JAR from another job).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.1.0)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          mvn-toolchain-vendor: Eclipse Adoptium
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./mvnw -B -DskipTests -Prelease -Drevision=${{ inputs.version }} deploy
